<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My messages | PataHome</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FBFAF7">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ph.css?v=15">
<link rel="stylesheet" href="/page.css?v=1">
</head>
<body class="ph sub page-messages">
<script>try{if(localStorage.getItem("ph_theme")==="dark"){document.documentElement.classList.add("dark");document.body.classList.add("dark")}}catch(e){}</script>
<header class="ph-header" id="hd"><div class="ph-wrap ph-hd"><a class="ph-logo" href="/" aria-label="PataHome home"><img src="/patahome-logo-transparent.png?v=20260921-2" alt="PataHome"></a><div class="header-actions"><a class="ph-btn ph-btn-line ph-btn-sm" href="/browse">Browse homes</a></div></div></header>
<div class="sub-main" id="app"><div class="empty">Loading…</div></div>
<footer class="sub-foot"><b>PataHome</b> · Kenya<br><a href="/browse">Browse</a><a href="/areas">Areas</a><a href="/dashboard">List a property</a><a href="/privacy">Privacy</a><a href="/terms">Terms</a></footer>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>"KES "+Number(n).toLocaleString("en-KE");
const token=new URLSearchParams(location.search).get("t");
const saved=k=>{try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(e){return[]}};
function remember(t,title){try{const a=saved("ph_threads").filter(x=>x.t!==t);a.unshift({t,title,at:Date.now()});localStorage.setItem("ph_threads",JSON.stringify(a.slice(0,30)))}catch(e){}}
async function api(p,o={}){const r=await fetch(p,{...o,headers:{"Content-Type":"application/json"}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Something went wrong");return d}

async function list(){
  const threads=saved("ph_threads"),views=saved("ph_viewings");
  let html=`<h1>My messages &amp; viewings</h1><div class="sub">Saved on this device. Links in your emails/SMS open the same conversations.</div>`;
  if(!threads.length&&!views.length){$("app").innerHTML=html+`<div class="card empty">Nothing here yet. Message an owner or book a viewing from any listing and it will show up here.</div>`;return}
  const vs=await Promise.all(views.map(v=>api("/api/viewings/"+v.t).then(d=>({...d,t:v.t})).catch(()=>null)));
  const ts=await Promise.all(threads.map(v=>api("/api/threads/"+v.t).then(d=>({...d,t:v.t})).catch(()=>null)));
  const vv=vs.filter(Boolean),tt=ts.filter(Boolean);
  if(vv.length)html+=`<h3>Viewings</h3>`+vv.map(v=>`<a class="card item" href="/viewing?t=${v.t}"><div><b>${esc(v.title)}</b><br><small>📅 ${esc(v.slotLabel)} · ${esc(v.area)}</small></div><span class="pill ${v.status==="confirmed"?"":v.status==="requested"?"warn":"off"}">${esc(v.status)}</span></a>`).join("");
  if(tt.length)html+=`<h3>Conversations</h3>`+tt.map(c=>{const last=c.messages[c.messages.length-1];return `<a class="card item" href="/messages?t=${c.t}"><div><b>${esc(c.listing.title)}</b><br><small>${last.sender==="owner"?"Owner: ":"You: "}${esc(last.body.slice(0,70))}</small></div>${last.sender==="owner"?'<span class="pill">new reply</span>':""}</a>`}).join("");
  $("app").innerHTML=html;
}
async function thread(){
  let d;
  try{d=await api("/api/threads/"+token)}catch(e){$("app").innerHTML=`<div class="card empty">${esc(e.message)}. <a href="/messages">See your saved conversations</a>.</div>`;return}
  remember(token,d.listing.title);
  const unit=d.listing.category==="rent"?"/month":d.listing.category==="shortlet"?"/night":"";
  $("app").innerHTML=`
    <div class="card listing"><div><b>${esc(d.listing.title)}</b><div class="sub" style="margin:2px 0 0">${fmt(d.listing.price)}${unit} · ${esc(d.listing.area)}${d.listing.live?"":" · no longer listed"}</div></div>
      ${d.listing.live?`<a href="/browse?open=${d.listing.id}">View listing →</a>`:""}</div>
    <h1>Chat with ${esc(d.ownerName)}${d.ownerVerified?' <span class="pill">✓ verified</span>':""}</h1>
    <div class="bubbles" id="bubbles">${d.messages.map(m=>`<div class="bub ${m.sender}"><div>${esc(m.body)}</div><span>${m.sender==="tenant"?"You":esc(d.ownerName)} · ${esc(m.at||"")}</span></div>`).join("")}</div>
    <div class="safe"><b>Stay safe:</b> never pay a deposit, rent or "viewing fee" before you've seen the house and met the owner.</div>
    <div class="compose"><textarea id="msg" rows="1" maxlength="2000" placeholder="Write a message…"></textarea><button id="send" onclick="send()">Send</button></div>
    <div class="err" id="err"></div>`;
  window.scrollTo(0,document.body.scrollHeight);
}
async function send(){
  const v=$("msg").value.trim();if(!v)return;
  $("send").disabled=true;$("err").textContent="";
  try{await api("/api/threads/"+token,{method:"POST",body:JSON.stringify({body:v})});await thread()}
  catch(e){$("err").textContent=e.message}
  finally{const b=$("send");if(b)b.disabled=false}
}
token?thread():list();
if(token)setInterval(()=>{if(!document.hidden&&!($("msg")&&$("msg").value))thread()},30000);
</script>
<script src="/i18n.js?v=4" defer></script>
<script src="/app.js?v=4" defer></script>
</body>
</html>
