<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your viewing | PataHome</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FBFAF7">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ph.css?v=12">
<link rel="stylesheet" href="/page.css?v=1">
</head>
<body class="ph sub page-viewing">
<script>try{if(localStorage.getItem("ph_theme")==="dark"){document.documentElement.classList.add("dark");document.body.classList.add("dark")}}catch(e){}</script>
<header class="ph-header" id="hd"><div class="ph-wrap ph-hd"><a class="ph-logo" href="/" aria-label="PataHome home"><img src="/patahome-logo-transparent.png?v=20260921-2" alt="PataHome"></a><div class="header-actions"><a class="ph-btn ph-btn-line ph-btn-sm" href="/messages">My messages</a></div></div></header>
<div class="sub-main" id="app">Loading…</div>
<footer class="sub-foot"><b>PataHome</b> · Kenya<br><a href="/browse">Browse</a><a href="/areas">Areas</a><a href="/dashboard">List a property</a><a href="/privacy">Privacy</a><a href="/terms">Terms</a></footer>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const token=new URLSearchParams(location.search).get("t");
const TXT={requested:"Waiting for the owner to confirm",confirmed:"Confirmed, see you there",declined:"The owner can't make this time",cancelled:"You cancelled this viewing"};
async function load(){
  if(!token){$("app").innerHTML='<div class="card">No viewing selected. <a href="/messages">See your viewings</a>.</div>';return}
  const r=await fetch("/api/viewings/"+token);const v=await r.json().catch(()=>({}));
  if(!r.ok){$("app").innerHTML=`<div class="card">${esc(v.error||"Viewing not found")}.</div>`;return}
  try{const a=JSON.parse(localStorage.getItem("ph_viewings")||"[]").filter(x=>x.t!==token);a.unshift({t:token,title:v.title,at:Date.now()});localStorage.setItem("ph_viewings",JSON.stringify(a.slice(0,30)))}catch(e){}
  const open=["requested","confirmed"].includes(v.status)&&new Date(v.slotAt)>Date.now();
  $("app").innerHTML=`<div class="card">
    <span class="st ${v.status}">${esc(v.status)}</span>
    <h1>${esc(v.title)}</h1>
    <div class="muted">${esc(v.area)} · with ${esc(v.ownerName)}</div>
    <div class="when">📅 ${esc(v.slotLabel)}</div>
    <div class="muted">${TXT[v.status]||""}</div>
    <div class="row">
      <a class="btn" href="/browse?open=${v.listingId}">View the listing</a>
      ${open?`<button onclick="cancelIt()">Cancel viewing</button>`:""}
    </div>
    <div class="safe"><b>Stay safe:</b> viewings are free. Never pay a deposit, rent or "viewing fee" before you've seen the house and met the owner.</div>
  </div>`;
}
async function cancelIt(){
  if(!confirm("Cancel this viewing? The owner will be told."))return;
  const r=await fetch(`/api/viewings/${token}/cancel`,{method:"POST"});
  if(!r.ok){const d=await r.json().catch(()=>({}));alert(d.error||"Couldn't cancel");return}
  load();
}
load();
</script>
<script src="/i18n.js?v=3" defer></script>
<script src="/app.js?v=3" defer></script>
</body>
</html>
