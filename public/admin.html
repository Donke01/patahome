<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin | PataHome</title>
<meta name="theme-color" content="#0e8a68">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --violet:#0e8a68; --violet-dark:#0b6b51; --violet-light:#e9f6f1;
    --ink:#1a2420; --muted:#5f6d66; --line:#d9e3dd; --bg:#fbfcfb;
    --orange:#c9a35c; --card:#fff; --red:#b3413a;
    --shadow:0 1px 3px rgba(16,40,30,.06), 0 6px 20px rgba(16,40,30,.06);
    --serif:'Fraunces',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
  html,body{overflow-x:clip;max-width:100%}
  button{font-family:inherit;cursor:pointer}
  input{font-family:inherit}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @view-transition{navigation:auto}
  @keyframes vtOut{to{opacity:0;transform:translateX(-26px)}}
  @keyframes vtIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
  ::view-transition-old(root){animation:vtOut .26s ease both}
  ::view-transition-new(root){animation:vtIn .34s cubic-bezier(.16,1,.3,1) both}
  .btn:active{transform:scale(.96)}
  @media(prefers-reduced-motion:reduce){::view-transition-old(root),::view-transition-new(root){animation:none}}

  header{position:sticky;top:0;z-index:100;background:#0d1512;color:#fff;padding:12px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .logo{font-weight:800;font-size:1.2rem;font-family:var(--serif)}
  .logo b{color:var(--orange)}
  .logo .tag{font-size:.7rem;background:var(--orange);border-radius:999px;padding:2px 10px;font-weight:800;margin-left:8px;vertical-align:middle}
  .header-right{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:.85rem;flex-wrap:wrap;justify-content:flex-end;min-width:0}
  @media(max-width:640px){
    header{padding:10px 14px;gap:8px}
    #who{display:none}
    .header-right{gap:7px}
    .header-right .btn{padding:7px 11px;font-size:.76rem}
    .wrap{padding:18px 14px 50px}
  }
  .btn{border:none;border-radius:10px;padding:8px 15px;font-weight:700;font-size:.85rem;transition:.15s}
  .btn-primary{background:var(--violet);color:#fff}
  .btn-primary:hover{background:var(--violet-dark)}
  .btn-ghost{background:transparent;color:var(--violet);border:1.5px solid var(--violet)}
  .btn-danger{background:transparent;color:var(--red);border:1.5px solid #e5b9b3}
  .btn-sm{padding:5px 11px;font-size:.76rem;border-radius:8px}
  .btn-white{background:#fff;color:#0d1512}

  .wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
  .auth-card{max-width:380px;margin:10vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow);animation:fadeUp .4s both}
  .auth-card h1{font-family:var(--serif);font-size:1.3rem;font-weight:600;color:var(--violet-dark)}
  .auth-card .sub{font-size:.84rem;color:var(--muted);margin-bottom:12px}
  label{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin:11px 0 4px}
  input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.9rem;outline:none}
  input:focus{border-color:var(--violet)}
  .err{color:var(--red);font-size:.82rem;margin-top:10px;min-height:1.2em}

  .overview-head{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
  .overview-head h2{font-family:var(--serif);font-size:1.3rem;font-weight:600}
  @keyframes livePulse{0%,100%{box-shadow:0 0 0 0 rgba(14,138,104,.45)}50%{box-shadow:0 0 0 6px rgba(14,138,104,0)}}
  .live-pill{display:inline-flex;align-items:center;gap:7px;background:var(--violet-light);color:var(--violet);font-size:.72rem;font-weight:800;letter-spacing:1.2px;border-radius:999px;padding:5px 13px}
  .live-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--violet);animation:livePulse 1.8s infinite}
  .updated{font-size:.76rem;color:var(--muted);margin-left:auto}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);animation:fadeUp .4s both;position:relative;overflow:hidden}
  .stat::after{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--violet),var(--orange));opacity:0;transition:opacity .2s}
  .stat:hover::after{opacity:1}
  .stat .num{font-family:var(--serif);font-size:1.55rem;font-weight:600;color:var(--violet-dark)}
  .stat .lbl{font-size:.74rem;color:var(--muted)}
  .stat.rev .num{color:var(--orange)}
  .trend{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:800;border-radius:999px;padding:2px 8px;margin-left:8px;vertical-align:middle}
  .trend.up{background:var(--violet-light);color:var(--violet)}
  .trend.down{background:#faeeed;color:var(--red)}
  .trend.flat{background:#f0f2f1;color:var(--muted)}
  .panel-grid{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:22px}
  @media(max-width:800px){.panel-grid{grid-template-columns:1fr}}
  .chart-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);animation:fadeUp .4s both}
  .chart-card h3{font-family:var(--serif);font-size:.98rem;font-weight:600;margin-bottom:10px}
  .chart-card h3 small{font-family:'Inter',sans-serif;font-weight:500;color:var(--muted);font-size:.74rem;margin-left:8px}
  .chart-wrap{position:relative;height:200px}
  .hot-card{background:linear-gradient(150deg,#0a4636,#0e8a68);color:#fff;border-radius:14px;padding:18px;box-shadow:var(--shadow);animation:fadeUp .4s both;display:flex;flex-direction:column;justify-content:center}
  .hot-card .hc-kick{font-size:.66rem;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:#d9c390;margin-bottom:8px}
  .hot-card .hc-title{font-family:var(--serif);font-size:1.05rem;font-weight:600;line-height:1.3}
  .hot-card .hc-sub{font-size:.8rem;opacity:.8;margin-top:8px}
  .hot-card .hc-num{font-family:var(--serif);font-size:1.9rem;color:#e3c98c;font-weight:600;margin-top:2px}

  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .tab{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 18px;font-weight:700;font-size:.85rem;color:var(--muted)}
  .tab.on{background:var(--violet);border-color:var(--violet);color:#fff}

  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  th{background:var(--violet-light);color:var(--violet-dark);text-align:left;padding:10px 14px;font-size:.72rem;text-transform:uppercase;letter-spacing:.5px}
  td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
  .muted{color:var(--muted);font-size:.78rem}
  .pill{display:inline-block;font-size:.68rem;font-weight:800;border-radius:999px;padding:2px 9px}
  .pill.ok{background:var(--violet-light);color:var(--violet-dark)}
  .pill.warn{background:#fff3e6;color:#b45309}
  .pill.feat{background:var(--orange);color:#fff}
  .table-scroll{overflow-x:auto}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:12px;font-size:.9rem;z-index:3000;opacity:0;transition:.3s}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .tr-top{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .tr-top div{border:1px solid var(--line,#e3e8e5);border-radius:12px;padding:12px 14px}
  .tr-top b{display:block;font-size:1.5rem}.tr-top span{font-size:.78rem;color:var(--muted,#5f6b66)}
  .tr-bars{display:flex;align-items:flex-end;gap:3px;height:120px;padding:8px;border:1px solid var(--line,#e3e8e5);border-radius:12px}
  .tr-bars i{flex:1;background:#cfe9dc;border-radius:3px 3px 0 0;position:relative;min-height:2px}
  .tr-bars em{position:absolute;left:0;right:0;bottom:0;background:#0e7c5a;border-radius:3px 3px 0 0}
  .tr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .tr-card{border:1px solid var(--line,#e3e8e5);border-radius:12px;padding:12px 14px}
  .tr-card h4{margin:0 0 8px;font-size:.85rem}
  .tr-row{display:flex;justify-content:space-between;gap:10px;font-size:.84rem;padding:4px 0;border-bottom:1px dashed #eef1ef}
  .ph-wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
  .ph-item{border:1px solid var(--line,#e3e8e5);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
  .ph-item img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
  .ph-cap{padding:6px 8px;font-size:.75rem;flex:1}.ph-cap a{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ph-cap span{color:var(--muted,#5f6b66)}
  .ph-item .btn{margin:0 8px 8px}
  .bk-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .role-pill{font-size:.68rem;font-weight:800;background:var(--orange);color:#fff;border-radius:999px;padding:2px 9px}
  .pill.bad{background:#fdecea;color:#8a2319}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:#fcfdfc}
  .toolbar input,.toolbar select{width:auto;flex:1;min-width:160px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.85rem}
  .toolbar select{flex:0 0 auto}
  .bulkbar{display:none;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#fff8e8;border-bottom:1px solid #f0dfb4;font-size:.84rem}
  .bulkbar.on{display:flex}
  td input[type=checkbox],th input[type=checkbox]{width:16px;height:16px}
  .mdl{position:fixed;inset:0;background:rgba(10,20,16,.55);z-index:2000;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:4vh 12px}
  .mdl.on{display:flex}
  .mdl-card{background:#fff;border-radius:16px;max-width:860px;width:100%;padding:22px 22px 18px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:fadeUp .3s both}
  .mdl-card h2{font-family:var(--serif);font-size:1.2rem;margin-bottom:4px;padding-right:30px}
  .mdl-x{position:absolute;top:12px;right:12px;border:0;background:#f0f3f1;border-radius:50%;width:32px;height:32px;font-size:1rem}
  .mdl-card textarea,.mdl-card select,.site-card textarea,.site-card select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-size:.88rem}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .sec{margin-top:18px}
  .sec h3{font-size:.92rem;margin-bottom:6px}
  .kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 16px;font-size:.84rem;margin-top:8px}
  .kv span{color:var(--muted);display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.4px}
  .site-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;padding:14px}
  .site-card{border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .site-card h3{font-size:.95rem;margin-bottom:2px}
  .site-card .muted{margin-bottom:6px}
  .chk{display:flex;align-items:center;gap:8px;font-size:.86rem;margin:8px 0;font-weight:600;color:var(--ink)}
  .chk input{width:18px;height:18px}
  .mini{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px}
  .mini table{font-size:.8rem}.mini td,.mini th{padding:7px 10px}
  .code-step{display:none}
</style>
<link rel="stylesheet" href="/refresh.css?v=2">
</head>
<body>

<header>
  <span class="logo">Pata<b>Home</b><span class="tag">ADMIN</span></span>
  <div class="header-right" id="hdr" style="display:none">
    <span id="who"></span> <span class="role-pill" id="roleTag"></span>
    <a class="btn btn-white" href="/" style="text-decoration:none">View Site</a>
    <button class="btn btn-primary" onclick="logout()">Log Out</button>
  </div>
</header>

<div id="authView">
  <div class="auth-card">
    <h1>Admin Access</h1>
    <div class="sub">This area is for the PataHome administrator only.</div>
    <div id="passStep">
      <label>Phone or email</label>
      <input id="aPhone" placeholder="07XXXXXXXX or you@email.com" autocomplete="username">
      <label>Password</label>
      <input id="aPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    </div>
    <div class="code-step" id="codeStep">
      <div class="muted" id="codeHint" style="margin-top:8px"></div>
      <label>Login code</label>
      <input id="aCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code" onkeydown="if(event.key==='Enter')login()">
    </div>
    <div class="err" id="authErr"></div>
    <button class="btn btn-primary" id="loginBtn" style="width:100%;padding:11px" onclick="login()">Log In</button>
  </div>
</div>

<div id="dash" class="wrap" style="display:none">
  <div class="overview-head">
    <h2>Platform Overview</h2>
    <span class="live-pill"><span class="dot"></span>LIVE</span>
    <span class="updated" id="updatedAgo"></span>
  </div>
  <div class="stats" id="stats"></div>
  <div class="panel-grid">
    <div class="chart-card">
      <h3>Platform activity<small>last 30 days</small></h3>
      <div class="chart-wrap"><canvas id="actChart"></canvas></div>
    </div>
    <div class="hot-card">
      <div class="hc-kick">Hottest This Week</div>
      <div class="hc-title" id="hcTitle">-</div>
      <div class="hc-sub">leads in the last 7 days</div>
      <div class="hc-num" id="hcLeads">0</div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab on" data-tab="listings" data-cap="view" onclick="setTab('listings')">Listings</button>
    <button class="tab" data-tab="users" data-cap="view" onclick="setTab('users')">People</button>
    <button class="tab" data-tab="verifs" data-cap="moderate" onclick="setTab('verifs')">Verifications <span id="vCount" style="background:var(--red);color:#fff;border-radius:999px;padding:1px 8px;font-size:.7rem;display:none"></span></button>
    <button class="tab" data-tab="reports" data-cap="moderate" onclick="setTab('reports')">Reports &amp; flags <span id="rCount" style="background:var(--red);color:#fff;border-radius:999px;padding:1px 8px;font-size:.7rem;display:none"></span></button>
    <button class="tab" data-tab="assisted" data-cap="moderate" onclick="setTab('assisted')">Listed for owners</button>
    <button class="tab" data-tab="support" data-cap="support" onclick="setTab('support')">Support <span id="sCount" style="background:var(--red);color:#fff;border-radius:999px;padding:1px 8px;font-size:.7rem;display:none"></span></button>
    <button class="tab" data-tab="growth" data-cap="view" onclick="setTab('growth')">Growth</button>
    <button class="tab" data-tab="traffic" data-cap="view" onclick="setTab('traffic')">Traffic</button>
    <button class="tab" data-tab="photos" data-cap="moderate" onclick="setTab('photos')">Photos</button>
    <button class="tab" data-tab="hero" data-cap="super" onclick="setTab('hero')">Homepage photos</button>
    <button class="tab" data-tab="site" data-cap="moderate" onclick="setTab('site')">Site</button>
    <button class="tab" data-tab="message" data-cap="super" onclick="setTab('message')">Message users</button>
    <button class="tab" data-tab="audit" data-cap="super" onclick="setTab('audit')">Audit log</button>
    <button class="tab" data-tab="backups" data-cap="super" onclick="setTab('backups')">Backups</button>
  </div>
  <div class="panel table-scroll" id="panel"></div>
</div>

<div class="toast" id="toast"></div>
<div class="mdl" id="mdl" onclick="if(event.target===this)closeModal()"><div class="mdl-card"><button class="mdl-x" aria-label="Close" onclick="closeModal()">✕</button><div id="mdlBody"></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
let token=localStorage.getItem("ph_admin")||null, tab="listings", cache={}, listStatus="";
const $=id=>document.getElementById(id);
const fmt=n=>"KES "+Number(n).toLocaleString("en-KE");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2600)}

async function api(path,opts={}){
  const r=await fetch(path,{...opts,headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})}});
  const d=await r.json().catch(()=>({}));
  if(r.status===401&&d.code==="SESSION_EXPIRED"&&token){token=null;localStorage.removeItem("ph_admin");alert(d.error);location.reload();throw new Error(d.error)}
  if(!r.ok)throw new Error(d.error||"Request failed");
  return d;
}
let challenge=null, ADMIN=null;
async function login(){
  $("authErr").textContent="";
  try{
    let r;
    if(challenge){
      r=await api("/api/auth/login/verify",{method:"POST",body:JSON.stringify({challenge,code:$("aCode").value.trim()})});
    }else{
      const id=$("aPhone").value.trim();
      r=await api("/api/auth/login",{method:"POST",body:JSON.stringify(/@/.test(id)?{email:id,password:$("aPass").value}:{phone:id,password:$("aPass").value})});
      if(r.twoFactor){
        challenge=r.twoFactor.challenge;
        $("passStep").style.display="none";$("codeStep").style.display="block";
        $("codeHint").textContent=`We sent a 6-digit code by ${r.twoFactor.channel==="sms"?"SMS":"email"} to ${r.twoFactor.target}. It expires in 10 minutes.`;
        $("loginBtn").textContent="Verify & enter";setTimeout(()=>$("aCode").focus(),50);return;
      }
    }
    token=r.token;
    ADMIN=await api("/api/admin/me"); // verifies admin role
    localStorage.setItem("ph_admin",token);
    enter(r.user.name);
  }catch(e){
    if(!challenge)token=null;
    $("authErr").textContent=e.message==="Admin access only"?"This account is not an admin.":e.message;
    if(/log in again/.test(e.message)){challenge=null;$("passStep").style.display="block";$("codeStep").style.display="none";$("loginBtn").textContent="Log In"}
  }
}
function logout(){if(token)fetch("/api/auth/logout",{method:"POST",headers:{Authorization:"Bearer "+token}}).catch(()=>{});token=null;localStorage.removeItem("ph_admin");setTimeout(()=>location.reload(),150)}

const hasCap=c=>!!(ADMIN&&ADMIN.caps.includes(c));
async function enter(name){
  if(!ADMIN)ADMIN=await api("/api/admin/me");
  $("authView").style.display="none";$("dash").style.display="block";$("hdr").style.display="flex";
  $("who").textContent=name||"Admin";$("roleTag").textContent=ADMIN.roleLabel;
  document.querySelectorAll(".tab[data-cap]").forEach(b=>b.style.display=hasCap(b.dataset.cap)?"":"none");
  await refresh();
}
let chart=null, lastUpdated=null;
async function refresh(){
  const [o,listings,users,stats,verifs,tickets]=await Promise.all([
    api("/api/admin/overview"),api("/api/admin/listings"+(listStatus?"?status="+listStatus:"")).catch(()=>[]),api("/api/admin/users").catch(()=>[]),
    api("/api/admin/stats").catch(()=>null),
    hasCap("moderate")?api("/api/admin/verifications").catch(()=>[]):[],
    hasCap("support")?api("/api/admin/support").catch(()=>[]):[]]);
  const moderation=hasCap("moderate")?await api("/api/admin/moderation").catch(()=>[]):[];
  const landDocs=hasCap("moderate")?await api("/api/admin/land-docs").catch(()=>[]):[];
  cache={listings,users,verifs,tickets,moderation,landDocs};
  const rc=$("rCount");rc.textContent=moderation.length;rc.style.display=moderation.length?"inline-block":"none";
  const vn=verifs.length+landDocs.length;const vc=$("vCount");vc.textContent=vn;vc.style.display=vn?"inline-block":"none";
  const openTix=tickets.filter(t=>t.status==="open").length;
  const sc=$("sCount");sc.textContent=openTix;sc.style.display=openTix?"inline-block":"none";
  const t=stats?stats.trendPct:0;
  const trend=stats?(t>0?`<span class="trend up">▲ ${t}%</span>`:t<0?`<span class="trend down">▼ ${Math.abs(t)}%</span>`:`<span class="trend flat">0%</span>`):"";
  $("stats").innerHTML=`
    <div class="stat"><div class="num">${o.activeListings}</div><div class="lbl">Active listings</div></div>
    <div class="stat"><div class="num">${o.users}</div><div class="lbl">Registered users</div></div>
    <div class="stat"><div class="num">${o.verifiedOwners}</div><div class="lbl">Verified owners</div></div>
    <div class="stat"><div class="num">${o.totalLeads}${trend}</div><div class="lbl">Total leads</div></div>
    <div class="stat"><div class="num">${o.unrepliedInquiries}</div><div class="lbl">Unreplied inquiries</div></div>
    <div class="stat rev"><div class="num">${fmt(stats?stats.revenue:0)}</div><div class="lbl">Revenue (completed payments)</div></div>`;
  if(stats)renderLive(stats);
  lastUpdated=Date.now();tickUpdated();
  renderTab();
}
function renderLive(o){
  if(o.hotListing){$("hcTitle").textContent=o.hotListing.title;$("hcLeads").textContent=o.hotListing.leads}
  else{$("hcTitle").textContent="No leads this week yet";$("hcLeads").textContent="0"}
  renderChart(o.series);
}
function renderChart(series){
  if(typeof Chart==="undefined")return;
  const labels=series.map(x=>x.date.slice(5).replace("-","/"));
  const ds=[series.map(x=>x.leads),series.map(x=>x.inquiries),series.map(x=>x.listings)];
  if(chart){
    chart.data.labels=labels;
    ds.forEach((d,i)=>chart.data.datasets[i].data=d);
    chart.update("none");
    return;
  }
  const ctx=$("actChart").getContext("2d");
  const grad=ctx.createLinearGradient(0,0,0,200);
  grad.addColorStop(0,"rgba(14,138,104,.26)");grad.addColorStop(1,"rgba(14,138,104,0)");
  chart=new Chart(ctx,{
    type:"line",
    data:{labels,datasets:[
      {label:"Leads",data:ds[0],borderColor:"#0e8a68",backgroundColor:grad,fill:true,tension:.35,borderWidth:2.5,pointRadius:0,pointHoverRadius:5},
      {label:"Messages",data:ds[1],borderColor:"#c9a35c",fill:false,tension:.35,borderWidth:2,pointRadius:0,pointHoverRadius:5,borderDash:[5,4]},
      {label:"New listings",data:ds[2],borderColor:"#3d4b56",fill:false,tension:.35,borderWidth:1.5,pointRadius:0,pointHoverRadius:5,borderDash:[2,3]}
    ]},
    options:{
      responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
      plugins:{legend:{position:"top",align:"end",labels:{boxWidth:10,boxHeight:10,usePointStyle:true,pointStyle:"circle",font:{family:"'Inter',sans-serif",size:11},color:"#5f6d66"}},
        tooltip:{backgroundColor:"#12201a",padding:10,cornerRadius:8}},
      scales:{
        x:{grid:{display:false},ticks:{maxTicksLimit:8,font:{size:10},color:"#8a968f"}},
        y:{beginAtZero:true,grid:{color:"rgba(0,0,0,.05)"},ticks:{precision:0,font:{size:10},color:"#8a968f"}}
      }
    }
  });
}
function tickUpdated(){
  if(!lastUpdated)return;
  const s=Math.round((Date.now()-lastUpdated)/1000);
  $("updatedAgo").textContent=s<5?"Updated just now":s<60?`Updated ${s}s ago`:`Updated ${Math.floor(s/60)}m ago`;
}
setInterval(tickUpdated,5000);
setInterval(()=>{if(token&&$("dash").style.display!=="none"&&!document.hidden)refresh().catch(()=>{})},30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&token&&$("dash").style.display!=="none")refresh().catch(()=>{})});
const EXTRA_TABS=["traffic","photos","backups","growth","site","audit","message","assisted","hero"];
function setTab(t){
  tab=t;
  document.querySelectorAll(".tab[data-tab]").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
  if(EXTRA_TABS.includes(t)){$("panel").innerHTML='<div style="padding:34px;text-align:center;color:var(--muted)">Loading…</div>';loadExtra(t);return}
  renderTab();
}
function renderTab(){
  const CAT={rent:"Rent",sale:"Sale",shortlet:"Airbnb",land:"Land",commercial:"Commercial"};
  if(tab==="listings"){ renderListings(); return;
  }else if(tab==="verifs"){
    const v=cache.verifs||[], ld=cache.landDocs||[];
    const landHtml=ld.length?`<h3 style="margin:22px 0 4px;font-size:1rem">Land &amp; commercial documents to check</h3>
      <div class="muted" style="margin:0 0 10px">Compare the title / LR number with the official search. Approve only if the registered owner matches the account and there are no cautions or charges you weren't told about.</div>
      <table><tr><th>Property</th><th>Title / LR no.</th><th>Documents</th><th></th></tr>`+
      ld.map(x=>`<tr>
        <td><b>${esc(x.title)}</b><div class="muted">${esc(x.area)} · ${esc(x.size)} · ${esc(x.price)}</div><div class="muted">Owner: ${esc(x.owner)} · <a href="/browse?open=${x.id}" target="_blank" rel="noopener">#${x.id} ↗</a></div></td>
        <td><b>${esc(x.titleRef||"-")}</b></td>
        <td>${x.docs.length?x.docs.map((d,i)=>`<a href="${esc(d)}" target="_blank" rel="noopener" class="pill ok" style="margin-right:4px;text-decoration:none">Doc ${i+1} ↗</a>`).join(""):'<span class="muted">none</span>'}</td>
        <td style="white-space:nowrap">
          <button class="btn btn-primary btn-sm" onclick="reviewLand(${x.id},true)">Documents OK ✓</button>
          <button class="btn btn-danger btn-sm" onclick="reviewLand(${x.id},false)">Reject</button>
        </td></tr>`).join("")+`</table>`:"";
    $("panel").innerHTML=(v.length?`<table><tr><th>Applicant</th><th>ID</th><th>Location</th><th>Documents</th><th></th></tr>`+
      v.map(x=>`<tr>
        <td><b>${esc(x.legalName||x.name)}</b><div class="muted">${esc(x.name)} · ${esc(x.phone||"")} ${x.email?"· "+esc(x.email):""}</div><div class="muted">${x.listings} listing${x.listings===1?"":"s"}${x.dob?" · DOB "+esc(x.dob):""}</div></td>
        <td>${esc(x.idType||"ID")}: <b>${esc(x.idNumber||"-")}</b>${x.kraPin?`<div class="muted">KRA ${esc(x.kraPin)}</div>`:""}</td>
        <td class="muted">${esc([x.town,x.county].filter(Boolean).join(", ")||"-")}</td>
        <td>${x.docs.length?x.docs.map((d,i)=>`<a href="${esc(d)}" target="_blank" rel="noopener" class="pill ok" style="margin-right:4px;text-decoration:none">Doc ${i+1} ↗</a>`).join(""):'<span class="muted">none</span>'}</td>
        <td style="white-space:nowrap">
          <button class="btn btn-primary btn-sm" onclick="reviewVerif(${x.id},true)">Approve ✓</button>
          <button class="btn btn-danger btn-sm" onclick="reviewVerif(${x.id},false)">Reject</button>
        </td>
      </tr>`).join("")+`</table>`
      :(ld.length?"":`<div style="padding:34px;text-align:center;color:var(--muted)">No pending verifications, new requests will appear here.</div>`))+landHtml;
  }else if(tab==="users"){ renderUsers(); return;
  }else if(tab==="reports"){
    const m=cache.moderation||[];
    const FLAG={blocked_term:"Contains a blocked word or number",photo_reuse:"Photo reused from another account",price_outlier:"Suspiciously cheap",duplicate_title:"Same title/LR number as another account",photo_moderation:"Photo flagged by moderation",many_counties:"'Owner' in many counties",shared_contact:"WhatsApp shared with another account"};
    $("panel").innerHTML=m.length?`<table><tr><th>Listing</th><th>Why it's here</th><th>Owner</th><th></th></tr>`+
      m.map(x=>`<tr>
        <td><b>${esc(x.title)}</b> ${x.status==="under_review"?'<span class="pill warn">paused for review</span>':`<span class="pill ok">${esc(x.status)}</span>`}
          <div class="muted">#${x.id} · ${esc(x.area)}, ${esc(x.county)} · ${fmt(x.price)}${x.listerRole!=="owner"?" · "+esc(x.listerRole):""}</div>
          <a class="muted" href="/browse?open=${x.id}" target="_blank" rel="noopener">View listing ↗</a></td>
        <td style="white-space:normal;max-width:460px">
          ${x.flags.map(f=>`<div style="margin-bottom:6px"><span class="pill feat">${esc(FLAG[f.kind]||f.kind)}</span> <span class="muted">${esc(f.detail)}</span></div>`).join("")}
          ${x.reports.length?`<div style="margin-top:4px"><b>${x.reports.length} report${x.reports.length===1?"":"s"}</b></div>`+x.reports.map(r=>`<div class="muted" style="margin-top:4px">• <b>${esc(r.reason)}</b>${r.details?": “"+esc(r.details)+"”":""}${r.contact?` <span style="white-space:nowrap">(${esc(r.contact)})</span>`:""} <span style="opacity:.7">${esc(r.at)}</span></div>`).join(""):""}
        </td>
        <td>${esc(x.ownerName)}<div class="muted">${esc(x.ownerPhone||"")}${x.ownerEmail?"<br>"+esc(x.ownerEmail):""}</div></td>
        <td style="white-space:nowrap">
          <button class="btn btn-primary btn-sm" onclick="moderate(${x.id},'clear')">${x.status==="under_review"?"Restore ✓":"Looks fine ✓"}</button>
          <button class="btn btn-danger btn-sm" onclick="moderate(${x.id},'remove')">Remove</button>
          <button class="btn btn-ghost btn-sm" onclick="openUser(${x.ownerId})">Owner ›</button>
        </td>
      </tr>`).join("")+`</table>`
      :`<div style="padding:34px;text-align:center;color:var(--muted)">Nothing to review, visitor reports and automatic scam flags will appear here.</div>`;
  }else if(tab==="support"){
    const t=cache.tickets||[];
    if(!t.length){
      $("panel").innerHTML=`<div style="padding:34px;text-align:center;color:var(--muted)">No support tickets yet, messages from Request Help and the Live Chat widget will appear here.</div>`;
      return;
    }
    const waLink=(p,name,subj)=>{
      const n=String(p||"").replace(/[^0-9]/g,"").replace(/^0/,"254");
      if(!n) return "";
      const msg=encodeURIComponent(`Hi ${name||"there"}, this is PataHome support replying to your message${subj?` about "${subj.slice(0,60)}"`:""}. `);
      return `https://wa.me/${n}?text=${msg}`;
    };
    $("panel").innerHTML=`<table><tr><th>From</th><th>Subject / message</th><th>Received</th><th>Status</th><th></th></tr>`+
      t.map(x=>{
        const f=x.from||{}; const wa=waLink(f.phone,f.name,x.subject);
        const contactLinks=[
          f.phone?`<a href="tel:${esc(f.phone)}" style="text-decoration:none">📞 ${esc(f.phone)}</a>`:"",
          wa?`<a href="${wa}" target="_blank" rel="noopener" style="text-decoration:none">💬 WhatsApp</a>`:"",
          f.email?`<a href="mailto:${esc(f.email)}" style="text-decoration:none">✉️ ${esc(f.email)}</a>`:""
        ].filter(Boolean).join(" · ");
        return `<tr>
        <td><b>${esc(f.name||"-")}</b>${x.source==="live-chat"?' <span class="pill feat">CHAT</span>':""}
          <div class="muted" style="font-size:.82rem">${contactLinks||"-"}</div></td>
        <td><b>${esc(x.subject)}</b><div class="muted" style="white-space:normal;max-width:520px;margin-top:4px">${esc(x.message)}</div></td>
        <td class="muted" style="white-space:nowrap">${esc(x.createdAt)}</td>
        <td>${x.status==="open"?'<span class="pill warn">open</span>':'<span class="pill ok">resolved</span>'}</td>
        <td style="white-space:nowrap">${x.status==="open"
          ?`<button class="btn btn-primary btn-sm" onclick="setTicket(${x.id},'resolved')">Mark resolved ✓</button>`
          :`<button class="btn btn-ghost btn-sm" onclick="setTicket(${x.id},'open')">Reopen</button>`}</td>
      </tr>`;
      }).join("")+`</table>`;
  }
}
/* ---------- Traffic / Photos / Backups ---------- */
async function loadExtra(t){
  if(window.NEW_LOADERS&&NEW_LOADERS[t])return NEW_LOADERS[t]().catch(e=>{$("panel").innerHTML=`<div style="padding:34px;text-align:center;color:var(--red)">${esc(e.message)}</div>`});
  try{
    if(t==="traffic"){
      const a=await api("/api/admin/analytics?days=30");
      const max=Math.max(1,...a.series.map(x=>x.views));
      const list=(title,rows,fmtK)=>`<div class="tr-card"><h4>${title}</h4>${rows.length?rows.map(r=>`<div class="tr-row"><span>${fmtK?fmtK(r):esc(r.k||"-")}</span><b>${r.n}</b></div>`).join(""):'<div class="muted">No data yet</div>'}</div>`;
      $("panel").innerHTML=`
        <div class="tr-top"><div><b>${a.totals.visitors}</b><span>visitors · 30 days</span></div><div><b>${a.totals.views}</b><span>page views</span></div><div><b>${a.noResults.reduce((s,x)=>s+x.n,0)}</b><span>searches with no results</span></div></div>
        <div class="tr-bars">${a.series.map(x=>`<i title="${x.day}: ${x.visitors} visitors, ${x.views} views" style="height:${Math.round(x.views/max*100)}%"><em style="height:${x.views?Math.round(x.visitors/x.views*100):0}%"></em></i>`).join("")}</div>
        <div class="muted" style="font-size:.75rem;margin:4px 0 16px">Bars = daily page views (dark part = visitors). No cookies; counts are anonymous.</div>
        <div class="tr-grid">
          ${list("Searches with no results, recruit owners here",a.noResults)}
          ${list("Top searches",a.searches,r=>`${esc(r.k)} <span class="muted">(${r.results} results)</span>`)}
          ${list("Visitors' towns",a.towns)}
          ${list("Where visitors come from",a.referrers)}
          ${list("Most viewed pages",a.pages)}
        </div>`;
    }else if(t==="photos"){
      const ph=await api("/api/admin/photos");
      $("panel").innerHTML=ph.length?`<div class="muted" style="margin:0 0 10px">Newest listing photos. Remove anything that isn't the actual property, is offensive, or shows people/contact details. The owner is notified.</div>
        <div class="ph-wall">${ph.map(p=>`<div class="ph-item"><a href="${esc(p.full)}" target="_blank" rel="noopener"><img src="${esc(p.thumb)}" loading="lazy" alt=""></a>
          <div class="ph-cap"><a href="/browse?open=${p.listingId}" target="_blank" rel="noopener">${esc(p.title)}</a><span>${esc(p.owner)}${p.status!=="active"?" · "+esc(p.status):""}</span></div>
          <button class="btn btn-danger btn-sm" onclick="removePhoto(${p.listingId},'${esc(p.publicId)}')">Remove</button></div>`).join("")}</div>`
        :'<div style="padding:34px;text-align:center;color:var(--muted)">No listing photos yet.</div>';
    }else if(t==="backups"){
      const b=await api("/api/admin/backups");
      $("panel").innerHTML=`<div class="bk-head"><div><b>Daily database backups</b><div class="muted">Kept on the server volume (last 7)${b.cloud?" and in Cloudinary as private files (last 30)":", add Cloudinary keys to also keep off-server copies"}.</div></div>
          <div style="display:flex;gap:8px"><button class="btn btn-ghost btn-sm" onclick="downloadBackup()">Download latest</button><button class="btn btn-primary btn-sm" id="bkNow" onclick="backupNow()">Back up now</button></div></div>
        <table><tr><th>When (UTC)</th><th>File</th><th>Size</th><th>Off-server copy</th><th>Status</th></tr>${b.backups.map(x=>`<tr><td>${esc(x.at)}</td><td class="muted">${esc(x.file)}</td><td>${x.bytes?Math.round(x.bytes/1024)+" KB":"-"}</td><td>${x.remote?"✓ Cloudinary":"-"}</td><td>${x.ok?'<span class="pill ok">ok</span>':`<span class="pill warn">failed</span> <span class="muted">${esc(x.error)}</span>`}</td></tr>`).join("")||'<tr><td colspan="5" class="muted">No backups yet, the first runs a minute after the server starts.</td></tr>'}</table>`;
    }
  }catch(e){$("panel").innerHTML=`<div style="padding:34px;text-align:center;color:var(--red)">${esc(e.message)}</div>`}
}
async function removePhoto(listingId,publicId){
  const reason=prompt("Reason (shown to the owner), e.g. Not the actual property");if(reason===null)return;
  try{await api("/api/admin/photos/remove",{method:"POST",body:JSON.stringify({listingId,publicId,reason})});toast("Photo removed");loadExtra("photos")}catch(e){toast(e.message)}
}
async function backupNow(){
  const b=$("bkNow");b.disabled=true;b.textContent="Backing up…";
  try{const r=await api("/api/admin/backups",{method:"POST"});toast(`Backup done (${Math.round(r.bytes/1024)} KB)`)}catch(e){toast(e.message)}
  loadExtra("backups");
}
async function downloadBackup(){
  const r=await fetch("/api/admin/backups/latest",{headers:{Authorization:"Bearer "+token}});
  if(!r.ok){const d=await r.json().catch(()=>({}));toast(d.error||"No backup");return}
  const blob=await r.blob(),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=(r.headers.get("content-disposition")||"").match(/filename="([^"]+)"/)?.[1]||"patahome-backup.db.gz";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
async function moderate(id,action){
  if(action==="remove"&&!confirm("Remove this listing from PataHome? The owner will be notified."))return;
  try{await api(`/api/admin/moderation/${id}`,{method:"POST",body:JSON.stringify({action})});toast(action==="remove"?"Listing removed":"Cleared");await refresh();renderTab()}
  catch(e){toast(e.message)}
}
async function setTicket(id,status){
  try{await api("/api/admin/support/"+id,{method:"PATCH",body:JSON.stringify({status})});
    toast(status==="resolved"?"Ticket resolved":"Ticket reopened");await refresh();
  }catch(e){toast("Error: "+e.message)}
}
async function removeListing(id){
  if(!confirm("Remove listing #"+id+" from the site?"))return;
  try{await api("/api/listings/"+id,{method:"DELETE"});toast("Listing removed");await refresh()}
  catch(e){toast(e.message)}
}
async function setVerified(id,v){
  try{await api("/api/admin/users/"+id,{method:"PATCH",body:JSON.stringify({verified:v})});toast(v?"Owner verified ✓":"Verification removed");await refresh()}
  catch(e){toast(e.message)}
}

async function reviewLand(id,approve){
  let note=null;
  if(!approve){note=prompt("Reason (sent to the owner):","The official search doesn't match the listing. Please upload a recent search in your name.");if(note===null)return}
  try{
    await api("/api/admin/land-docs/"+id,{method:"POST",body:JSON.stringify({action:approve?"approve":"reject",note})});
    toast(approve?"Documents marked as checked ✓":"Documents rejected");
    await refresh();setTab("verifs");
  }catch(e){toast(e.message)}
}
async function reviewVerif(id,approve){
  let reason=null;
  if(!approve){reason=prompt("Reason for rejection (sent to the user):","We couldn't match your ID details. Please resubmit with a clearer photo.");if(reason===null)return}
  try{
    await api("/api/admin/verifications/"+id,{method:"POST",body:JSON.stringify({approve,reason})});
    toast(approve?"Owner verified ✓":"Request rejected");
    await refresh();setTab("verifs");
  }catch(e){toast(e.message)}
}

(async function(){
  if(token){
    try{const me=await api("/api/auth/me");ADMIN=await api("/api/admin/me");return enter(me.name)}
    catch{token=null;localStorage.removeItem("ph_admin")}
  }
  $("authView").style.display="block";
})();
