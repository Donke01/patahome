<!doctype html>
<html lang="en"><head><script src="/cookie-consent.js" defer></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Owner profile | PataHome</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ph.css?v=16">
<link rel="stylesheet" href="/page.css?v=1">
</head><body class="ph sub page-owner">
<script>try{if(localStorage.getItem("ph_theme")==="dark"){document.documentElement.classList.add("dark");document.body.classList.add("dark")}}catch(e){}</script>
<header class="ph-header" id="hd"><div class="ph-wrap ph-hd"><a class="ph-logo" href="/" aria-label="PataHome home"><img src="/patahome-logo-transparent.png?v=20260921-2" alt="PataHome"></a><div class="header-actions"><a class="ph-btn ph-btn-line ph-btn-sm" href="/browse">Browse homes</a></div></div></header><main class="sub-main wide">
<section class="profile"><div class="avatar" id="avatar">?</div><div><div class="name" id="name">Owner profile</div><div class="muted" id="bio">Loading profile…</div></div><div class="count"><b id="followers">0</b>followers</div></section>
<h2>Active listings</h2><div class="grid" id="listings"></div>
</main>
<footer class="sub-foot"><b>PataHome</b> · Kenya<br><a href="/browse">Browse</a><a href="/areas">Areas</a><a href="/dashboard">List a property</a><a href="/privacy">Privacy</a><a href="/terms">Terms</a></footer><script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>"KSh "+Number(n||0).toLocaleString();
async function init(){const id=new URLSearchParams(location.search).get("id");if(!id){document.getElementById("listings").innerHTML='<div class="empty">Owner not found.</div>';return}try{const p=await fetch(`/api/owners/${encodeURIComponent(id)}/profile`).then(r=>r.ok?r.json():Promise.reject());document.title=`${p.name}: PataHome`;document.getElementById("name").textContent=p.name;document.getElementById("avatar").textContent=(p.name||"?")[0];document.getElementById("bio").textContent=p.bio||"Direct property owner on PataHome";document.getElementById("followers").textContent=p.followers;document.getElementById("listings").innerHTML=p.listings.length?p.listings.map(x=>`<a class="card" href="/browse?open=${x.id}"><div class="photo">${x.photoUrls&&x.photoUrls.length?`<img src="${esc(x.photoUrls[0].thumb)}" alt="${esc(x.title)}">`:''}</div><div class="body"><div class="price">${money(x.price)}</div><div class="title">${esc(x.title)}</div><div class="area">${esc(x.area)}, ${esc(x.county)}</div></div></a>`).join(""):'<div class="empty">No active listings yet.</div>'}catch(e){document.getElementById("listings").innerHTML='<div class="empty">We couldn’t load this owner profile.</div>'}}init();
</script><script src="/app.js?v=6" defer></script>
</body></html>
