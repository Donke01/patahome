<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Owner profile — PataHome</title>
<link rel="stylesheet" href="/refresh.css?v=20260924-5">
<style>
body{margin:0;background:#fff;color:#17231e;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px 20px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-weight:800;color:#087b61;text-decoration:none;font-size:1.2rem}.back{color:#087b61;text-decoration:none;font-weight:700}.profile{display:flex;gap:18px;align-items:center;padding:24px;border:1px solid #d9e3dd;border-radius:18px;background:#f7fbf9;margin-bottom:28px}.avatar{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:#087b61;color:white;font-size:1.8rem;font-weight:800}.name{font-size:1.55rem;font-weight:800}.muted{color:#62736b;font-size:.9rem;line-height:1.5}.count{margin-left:auto;text-align:center;color:#087b61;font-weight:800}.count b{display:block;font-size:1.7rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.card{border:1px solid #d9e3dd;border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;background:#fff}.photo{height:170px;background:#edf2ef;display:grid;place-items:center}.photo img{width:100%;height:100%;object-fit:contain}.body{padding:14px}.price{font-weight:800;font-size:1.05rem}.title{font-weight:700;margin:4px 0}.area{font-size:.82rem;color:#62736b}.empty{text-align:center;padding:50px;color:#62736b}
@media(max-width:600px){.wrap{padding:20px 14px 42px}.profile{padding:18px;align-items:flex-start}.count{margin-left:0}.name{font-size:1.25rem}.grid{grid-template-columns:1fr}.photo{height:210px}}
</style></head><body><main class="wrap">
<div class="top"><a class="brand" href="/">PataHome</a><a class="back" href="/browse.html">← Browse listings</a></div>
<section class="profile"><div class="avatar" id="avatar">?</div><div><div class="name" id="name">Owner profile</div><div class="muted" id="bio">Loading profile…</div></div><div class="count"><b id="followers">0</b>followers</div></section>
<h2>Active listings</h2><div class="grid" id="listings"></div>
</main><script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>"KSh "+Number(n||0).toLocaleString();
async function init(){const id=new URLSearchParams(location.search).get("id");if(!id){document.getElementById("listings").innerHTML='<div class="empty">Owner not found.</div>';return}try{const p=await fetch(`/api/owners/${encodeURIComponent(id)}/profile`).then(r=>r.ok?r.json():Promise.reject());document.title=`${p.name} — PataHome`;document.getElementById("name").textContent=p.name;document.getElementById("avatar").textContent=(p.name||"?")[0];document.getElementById("bio").textContent=p.bio||"Direct property owner on PataHome";document.getElementById("followers").textContent=p.followers;document.getElementById("listings").innerHTML=p.listings.length?p.listings.map(x=>`<a class="card" href="/browse.html?open=${x.id}"><div class="photo">${x.photoUrls&&x.photoUrls.length?`<img src="${esc(x.photoUrls[0].thumb)}" alt="${esc(x.title)}">`:''}</div><div class="body"><div class="price">${money(x.price)}</div><div class="title">${esc(x.title)}</div><div class="area">${esc(x.area)}, ${esc(x.county)}</div></div></a>`).join(""):'<div class="empty">No active listings yet.</div>'}catch(e){document.getElementById("listings").innerHTML='<div class="empty">We couldn’t load this owner profile.</div>'}}init();
</script></body></html>
